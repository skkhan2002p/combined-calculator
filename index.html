<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Multi-Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="logo-area">
        <svg class="app-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="4" y="2" width="16" height="20" rx="3"></rect>
          <line x1="8" y1="6" x2="16" y2="6"></line>
          <line x1="16" y1="14" x2="16" y2="18"></line>
          <path d="M8 10h.01M12 10h.01M16 10h.01M8 14h.01M12 14h.01M8 18h.01M12 18h.01"></path>
        </svg>
        <h1>Omni Calc</h1>
      </div>
      <div class="tab-switch" role="tablist">
        <button type="button" class="tab-btn active" id="tab-age" role="tab" aria-selected="true" aria-controls="age-calc-view">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
          Age Calc
        </button>
        <button type="button" class="tab-btn" id="tab-sci" role="tab" aria-selected="false" aria-controls="sci-calc-view">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 19l6-6M4 13l6 6M14 5h6M17 2v6M14 17h6M14 13h6"></path>
          </svg>
          Scientific
        </button>
      </div>
    </header>

    <main class="content-area">
      <!-- AGE CALCULATOR VIEW -->
      <section id="age-calc-view" class="calc-view active" role="tabpanel">
        <div class="card">
          <h2 class="section-title">Age Calculator</h2>
          <p class="section-desc">Enter date directly as text (DD / MM / YYYY)</p>

          <form id="age-form" onsubmit="return false;">
            <div class="form-group">
              <label for="birth-day">Date of Birth</label>
              <div class="date-input-group">
                <div class="field-wrap">
                  <input type="text" id="birth-day" inputmode="numeric" maxlength="2" placeholder="DD" pattern="[0-9]*" required aria-label="Day">
                  <span class="field-label">Day</span>
                </div>
                <span class="sep">/</span>
                <div class="field-wrap">
                  <input type="text" id="birth-month" inputmode="numeric" maxlength="2" placeholder="MM" pattern="[0-9]*" required aria-label="Month">
                  <span class="field-label">Month</span>
                </div>
                <span class="sep">/</span>
                <div class="field-wrap">
                  <input type="text" id="birth-year" inputmode="numeric" maxlength="4" placeholder="YYYY" pattern="[0-9]*" required aria-label="Year">
                  <span class="field-label">Year</span>
                </div>
              </div>
            </div>



            <div class="quick-presets">
              <span class="preset-label">Quick Birth Year Presets:</span>
              <div class="preset-btns">
                <button type="button" class="chip-btn" data-year="2000">2000</button>
                <button type="button" class="chip-btn" data-year="1995">1995</button>
                <button type="button" class="chip-btn" data-year="1990">1990</button>
                <button type="button" class="chip-btn" data-year="1985">1985</button>
              </div>
            </div>

            <div class="action-row">
              <button type="submit" id="calc-age-btn" class="primary-btn">Calculate Age</button>
              <button type="button" id="reset-age-btn" class="secondary-btn">Reset</button>
            </div>
          </form>

          <div id="age-error" class="error-box hidden" role="alert"></div>

          <!-- RESULTS SECTION -->
          <div id="age-results" class="results-container hidden">
            <div class="hero-age-box">
              <div class="hero-age-item">
                <span class="hero-val" id="res-years">0</span>
                <span class="hero-lbl">Years</span>
              </div>
              <div class="hero-age-item">
                <span class="hero-val" id="res-months">0</span>
                <span class="hero-lbl">Months</span>
              </div>
              <div class="hero-age-item">
                <span class="hero-val" id="res-days">0</span>
                <span class="hero-lbl">Days</span>
              </div>
            </div>

            <div class="grid-stats">
              <div class="stat-card">
                <span class="stat-title">Born On</span>
                <span class="stat-val" id="res-dayofweek">-</span>
              </div>
              <div class="stat-card">
                <span class="stat-title">Zodiac Sign</span>
                <span class="stat-val" id="res-zodiac">-</span>
              </div>
              <div class="stat-card span-full">
                <span class="stat-title">Next Birthday In</span>
                <span class="stat-val highlight-val" id="res-nextbday">-</span>
              </div>
              <div class="stat-card">
                <span class="stat-title">Total Months</span>
                <span class="stat-val" id="res-total-months">-</span>
              </div>
              <div class="stat-card">
                <span class="stat-title">Total Weeks</span>
                <span class="stat-val" id="res-total-weeks">-</span>
              </div>
              <div class="stat-card">
                <span class="stat-title">Total Days</span>
                <span class="stat-val" id="res-total-days">-</span>
              </div>
              <div class="stat-card">
                <span class="stat-title">Total Hours (approx)</span>
                <span class="stat-val" id="res-total-hours">-</span>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- SCIENTIFIC CALCULATOR VIEW -->
      <section id="sci-calc-view" class="calc-view" role="tabpanel">
        <div class="card calc-card">
          <!-- DISPLAY -->
          <div class="calc-display-wrap">
            <div class="calc-sub-display" id="sci-expression"></div>
            <div class="calc-main-display" id="sci-result">0</div>
            <div class="mode-bar">
              <span class="mode-badge" id="deg-rad-indicator">DEG</span>
              <span class="mode-badge" id="mem-indicator" style="display:none;">M</span>
            </div>
          </div>

          <!-- KEYBOARD MODE TOGGLES -->
          <div class="sci-controls-bar">
            <button type="button" class="mode-toggle-btn active-mode" id="btn-deg-rad">DEG</button>
            <button type="button" class="mode-toggle-btn" id="btn-inv">INV</button>
            <button type="button" class="mode-toggle-btn" id="btn-mc">MC</button>
            <button type="button" class="mode-toggle-btn" id="btn-mr">MR</button>
            <button type="button" class="mode-toggle-btn" id="btn-mplus">M+</button>
          </div>

          <!-- KEYPAD -->
          <div class="keypad-grid">
            <!-- Row 1 Scientific -->
            <button type="button" class="key key-fn" data-action="sin">sin</button>
            <button type="button" class="key key-fn" data-action="cos">cos</button>
            <button type="button" class="key key-fn" data-action="tan">tan</button>
            <button type="button" class="key key-fn" data-action="log">log</button>
            <button type="button" class="key key-fn" data-action="ln">ln</button>

            <!-- Row 2 Scientific -->
            <button type="button" class="key key-fn" data-action="pow">xʸ</button>
            <button type="button" class="key key-fn" data-action="sqr">x²</button>
            <button type="button" class="key key-fn" data-action="sqrt">√</button>
            <button type="button" class="key key-fn" data-action="fact">n!</button>
            <button type="button" class="key key-fn" data-action="1x">1/x</button>

            <!-- Row 3 Functions/Brackets -->
            <button type="button" class="key key-util" data-action="pi">π</button>
            <button type="button" class="key key-util" data-action="e">e</button>
            <button type="button" class="key key-util" data-action="(">(</button>
            <button type="button" class="key key-util" data-action=")">)</button>
            <button type="button" class="key key-danger" data-action="clear">AC</button>

            <!-- Row 4 Digits & Ops -->
            <button type="button" class="key key-num" data-val="7">7</button>
            <button type="button" class="key key-num" data-val="8">8</button>
            <button type="button" class="key key-num" data-val="9">9</button>
            <button type="button" class="key key-op" data-action="backspace">⌫</button>
            <button type="button" class="key key-op" data-action="/">÷</button>

            <!-- Row 5 Digits & Ops -->
            <button type="button" class="key key-num" data-val="4">4</button>
            <button type="button" class="key key-num" data-val="5">5</button>
            <button type="button" class="key key-num" data-val="6">6</button>
            <button type="button" class="key key-op" data-action="*">×</button>
            <button type="button" class="key key-op" data-action="-">−</button>

            <!-- Row 6 Digits & Ops -->
            <button type="button" class="key key-num" data-val="1">1</button>
            <button type="button" class="key key-num" data-val="2">2</button>
            <button type="button" class="key key-num" data-val="3">3</button>
            <button type="button" class="key key-op" data-action="+">+</button>
            <button type="button" class="key key-op" data-action="%">%</button>

            <!-- Row 7 Digits & Equals -->
            <button type="button" class="key key-num" data-val="0">0</button>
            <button type="button" class="key key-num" data-val="00">00</button>
            <button type="button" class="key key-num" data-val=".">.</button>
            <button type="button" class="key key-num" data-action="plusminus">±</button>
            <button type="button" class="key key-equals" data-action="equals">=</button>
          </div>

          <!-- Scientific History Toggle -->
          <div class="history-section">
            <div class="history-header">
              <span>Calculation History</span>
              <button type="button" id="clear-history-btn" class="link-btn">Clear</button>
            </div>
            <ul id="sci-history-list" class="history-list">
              <li class="history-empty">No history yet</li>
            </ul>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
